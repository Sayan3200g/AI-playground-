<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AIPlayground — Sign In</title>
  <meta name="description" content="Sign in to AIPlayground to test AI models from OpenAI, Anthropic, Google and more."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="global.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    /* ── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      overflow-y: auto;
      background: #090a12;
      font-family: 'Inter', sans-serif;
    }

    /* ── Background Orbs ─────────────────────────────────── */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); pointer-events: none; z-index: 0;
      animation: floatOrb 10s ease-in-out infinite;
    }
    .orb-1 {
      width: min(700px, 100vw); height: min(700px, 100vw);
      background: radial-gradient(circle, rgba(124,106,247,.22) 0%, transparent 70%);
      top: -20%; left: -15%;
    }
    .orb-2 {
      width: min(600px, 90vw); height: min(600px, 90vw);
      background: radial-gradient(circle, rgba(0,212,200,.18) 0%, transparent 70%);
      bottom: -15%; right: -10%;
      animation-delay: -5s; animation-direction: reverse;
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-28px) scale(1.04); }
    }

    /* ── Navbar ──────────────────────────────────────────── */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 60px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 24px;
      background: rgba(9,10,18,.8); backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; font-family: 'Sora', sans-serif;
      font-weight: 700; font-size: 1rem; color: #e3e1ed;
    }
    .nav-brand img { width: 30px; border-radius: 7px; }
    .nav-back {
      font-size: .85rem; color: rgba(255,255,255,.45);
      text-decoration: none; transition: color .2s;
    }
    .nav-back:hover { color: #7c6af7; }

    /* ── Card ────────────────────────────────────────────── */
    .auth-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 460px;
      margin-top: 76px; /* clear fixed navbar */
      background: rgba(255,255,255,.04);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      padding: 44px 40px;
      box-shadow: 0 32px 80px rgba(0,0,0,.5);
      animation: slideUp .6s cubic-bezier(.22,1,.36,1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Brand ───────────────────────────────────────────── */
    .auth-brand {
      display: flex; align-items: center; gap: 12px;
      justify-content: center; margin-bottom: 32px;
    }
    .auth-brand img { width: 44px; height: 44px; border-radius: 10px; }
    .auth-brand-name {
      font-family: 'Sora', sans-serif;
      font-size: 1.35rem; font-weight: 800; color: #e3e1ed;
    }

    /* ── Tabs ────────────────────────────────────────────── */
    .tab-row {
      display: flex; gap: 0; margin-bottom: 32px;
      background: rgba(255,255,255,.04);
      border-radius: 12px; padding: 4px;
      border: 1px solid rgba(255,255,255,.08);
    }
    .tab-btn {
      flex: 1; padding: 10px; border: none;
      background: transparent; border-radius: 8px;
      font-family: 'Sora', sans-serif; font-weight: 600;
      font-size: .9rem; color: rgba(255,255,255,.42);
      cursor: pointer; transition: all .25s;
    }
    .tab-btn.active {
      background: rgba(124,106,247,.28);
      color: #e3e1ed;
      box-shadow: 0 0 18px rgba(124,106,247,.18);
    }

    /* ── Messages ────────────────────────────────────────── */
    .msg {
      padding: 12px 16px; border-radius: 10px;
      font-size: .88rem; margin-bottom: 18px;
      display: none; line-height: 1.5;
    }
    .msg.err {
      border: 1px solid rgba(255,111,145,.35);
      background: rgba(255,111,145,.1); color: #ffd7df;
    }
    .msg.ok {
      border: 1px solid rgba(0,212,200,.35);
      background: rgba(0,212,200,.1); color: #24ddd1;
    }
    .msg.info {
      border: 1px solid rgba(124,106,247,.35);
      background: rgba(124,106,247,.1); color: #c7bfff;
    }
    .msg.show { display: block; }

    /* ── Forms ───────────────────────────────────────────── */
    .form-panel { display: none; }
    .form-panel.active {
      display: block;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .field-wrap { position: relative; margin-bottom: 18px; }
    .field-label {
      display: block; font-size: .82rem;
      color: rgba(255,255,255,.5); margin-bottom: 7px;
    }
    .field-input {
      width: 100%; height: 48px; padding: 0 44px 0 14px;
      background: rgba(6,7,14,.75);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px; color: #e3e1ed;
      font-size: .95rem; outline: none;
      transition: border-color .25s, box-shadow .25s;
      -webkit-appearance: none;
    }
    .field-input:focus {
      border-color: rgba(124,106,247,.7);
      box-shadow: 0 0 0 3px rgba(124,106,247,.15);
    }
    .field-input::placeholder { color: rgba(255,255,255,.22); }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: rgba(255,255,255,.35); font-size: .8rem;
      cursor: pointer; padding: 4px 6px;
      transition: color .2s;
    }
    .pw-toggle:hover { color: #7c6af7; }

    /* Password field: normal padding when no toggle */
    .field-input.no-toggle { padding-right: 14px; }

    .forgot {
      display: block; text-align: right;
      font-size: .8rem; color: rgba(124,106,247,.8);
      text-decoration: none; margin-top: -10px;
      margin-bottom: 22px; transition: color .2s;
    }
    .forgot:hover { color: #7c6af7; }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn-submit {
      width: 100%; height: 52px; border: none;
      border-radius: 12px;
      font-family: 'Sora', sans-serif;
      font-weight: 700; font-size: 1rem;
      cursor: pointer;
      background: linear-gradient(135deg, #7c6af7, #5e9bff);
      color: #fff;
      box-shadow: 0 0 28px rgba(124,106,247,.38);
      transition: transform .2s, box-shadow .2s, opacity .2s;
      position: relative; overflow: hidden;
    }
    .btn-submit::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0);
      transition: background .2s;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 44px rgba(124,106,247,.58);
    }
    .btn-submit:active:not(:disabled) { transform: translateY(0); }
    .btn-submit:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 20px 0; color: rgba(255,255,255,.22); font-size: .8rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: rgba(255,255,255,.09);
    }

    .btn-google {
      width: 100%; height: 48px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      color: #e3e1ed;
      font-family: 'Sora', sans-serif;
      font-weight: 600; font-size: .92rem;
      cursor: pointer;
      display: flex; align-items: center;
      justify-content: center; gap: 10px;
      transition: background .2s, border-color .2s;
    }
    .btn-google:hover {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.22);
    }

    /* ── Footer Link ─────────────────────────────────────── */
    .back-link {
      display: block; text-align: center;
      margin-top: 24px; font-size: .84rem;
      color: rgba(255,255,255,.3); text-decoration: none;
      transition: color .2s;
    }
    .back-link:hover { color: #7c6af7; }

    /* ── Loading Spinner ─────────────────────────────────── */
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 500px) {
      body { padding: 16px 12px; }
      .auth-card {
        padding: 32px 22px;
        border-radius: 18px;
        margin-top: 68px;
      }
      .auth-brand-name { font-size: 1.2rem; }
      .tab-btn { font-size: .84rem; padding: 9px; }
      .btn-submit { height: 48px; font-size: .95rem; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="home.html" class="nav-brand">
      <img src="logo.png" alt="AIPlayground"/> AIPlayground
    </a>
    <a href="home.html" class="nav-back">← Home</a>
  </nav>

  <!-- Auth Card -->
  <div class="auth-card">
    <div class="auth-brand">
      <img src="logo.png" alt=""/>
      <span class="auth-brand-name">AIPlayground</span>
    </div>

    <div class="tab-row">
      <button class="tab-btn active" id="tabSignin" onclick="switchTab('signin')">Sign In</button>
      <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="msgBox" class="msg"></div>

    <!-- Sign In Form -->
    <form class="form-panel active" id="signinForm" onsubmit="handleSignin(event)" novalidate>
      <div class="field-wrap">
        <label class="field-label" for="siEmail">Email address</label>
        <input id="siEmail" class="field-input no-toggle" type="email"
               placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <div class="field-wrap">
        <label class="field-label" for="siPass">Password</label>
        <input id="siPass" class="field-input" type="password"
               placeholder="••••••••" required autocomplete="current-password"/>
        <button type="button" class="pw-toggle" onclick="togglePw('siPass',this)" aria-label="Show password">👁</button>
      </div>
      <a href="#" class="forgot" onclick="handleForgot(event)">Forgot password?</a>
      <button type="submit" class="btn-submit" id="siBtn">Sign In</button>
    </form>

    <!-- Sign Up Form -->
    <form class="form-panel" id="signupForm" onsubmit="handleSignup(event)" novalidate>
      <div class="field-wrap">
        <label class="field-label" for="suName">Full name</label>
        <input id="suName" class="field-input no-toggle" type="text"
               placeholder="John Doe" required autocomplete="name"/>
      </div>
      <div class="field-wrap">
        <label class="field-label" for="suEmail">Email address</label>
        <input id="suEmail" class="field-input no-toggle" type="email"
               placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <div class="field-wrap">
        <label class="field-label" for="suPass">Password</label>
        <input id="suPass" class="field-input" type="password"
               placeholder="Minimum 8 characters" required autocomplete="new-password"/>
        <button type="button" class="pw-toggle" onclick="togglePw('suPass',this)" aria-label="Show password">👁</button>
      </div>
      <div class="field-wrap">
        <label class="field-label" for="suPass2">Confirm password</label>
        <input id="suPass2" class="field-input no-toggle" type="password"
               placeholder="Repeat your password" required autocomplete="new-password"/>
      </div>
      <button type="submit" class="btn-submit" id="suBtn">Create Account</button>
    </form>

    <a href="home.html" class="back-link">← Back to Home</a>
  </div>

  <script>
    // ── State ─────────────────────────────────────────────
    let sb = null;
    let configLoaded = false;

    // ── Init: load config & Supabase ─────────────────────
    async function init() {
      try {
        const cfg = await fetch('/api/config').then(r => {
          if (!r.ok) throw new Error('Config endpoint failed');
          return r.json();
        });
        sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
        configLoaded = true;
        const { data: { session } } = await sb.auth.getSession();
        if (session) { window.location.href = 'index.html'; return; }
      } catch (e) {
        showMsg('info', '⚠️ Could not reach server. Make sure <code>node server.js</code> is running.');
      }
    }
    init();

    // ── UI helpers ────────────────────────────────────────
    function showMsg(type, html) {
      const el = document.getElementById('msgBox');
      el.className = 'msg show ' + type;
      el.innerHTML = html;
    }
    function clearMsg() {
      const el = document.getElementById('msgBox');
      el.className = 'msg';
      el.innerHTML = '';
    }

    function setLoading(btnId, loading, label) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.innerHTML = loading
        ? `<span class="spinner"></span>${label}`
        : label;
    }

    function switchTab(tab) {
      document.getElementById('signinForm').classList.toggle('active', tab === 'signin');
      document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
      document.getElementById('tabSignin').classList.toggle('active', tab === 'signin');
      document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
      clearMsg();
    }

    function togglePw(id, btn) {
      const inp = document.getElementById(id);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.textContent = show ? '🙈' : '👁';
    }

    function requireServer() {
      if (!configLoaded || !sb) {
        showMsg('err', '❌ Server not running. Open a terminal in the project folder and run: <br/><code style="font-family:monospace;background:rgba(0,0,0,.3);padding:2px 6px;border-radius:4px;">node server.js</code>');
        return false;
      }
      return true;
    }

    // ── Sign In ────────────────────────────────────────────
    async function handleSignin(e) {
      e.preventDefault();
      if (!requireServer()) return;
      clearMsg();

      const email = document.getElementById('siEmail').value.trim();
      const pass  = document.getElementById('siPass').value;
      if (!email || !pass) { showMsg('err', '❌ Please fill in all fields.'); return; }

      setLoading('siBtn', true, 'Signing in…');
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) {
        showMsg('err', '❌ ' + error.message);
        setLoading('siBtn', false, 'Sign In');
      } else {
        showMsg('ok', '✅ Signed in! Redirecting…');
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      }
    }

    // ── Sign Up ────────────────────────────────────────────
    async function handleSignup(e) {
      e.preventDefault();
      if (!requireServer()) return;
      clearMsg();

      const name  = document.getElementById('suName').value.trim();
      const email = document.getElementById('suEmail').value.trim();
      const pass  = document.getElementById('suPass').value;
      const pass2 = document.getElementById('suPass2').value;

      if (!name || !email || !pass || !pass2) { showMsg('err', '❌ Please fill in all fields.'); return; }
      if (pass !== pass2) { showMsg('err', '❌ Passwords do not match.'); return; }
      if (pass.length < 8) { showMsg('err', '❌ Password must be at least 8 characters.'); return; }

      setLoading('suBtn', true, 'Creating account…');
      const { error } = await sb.auth.signUp({
        email, password: pass,
        options: { data: { full_name: name } },
      });
      setLoading('suBtn', false, 'Create Account');
      if (error) {
        showMsg('err', '❌ ' + error.message);
      } else {
        showMsg('ok', '✅ Account created! Check your email to confirm, then sign in.');
        document.getElementById('signupForm').reset();
      }
    }

    // ── Forgot Password ────────────────────────────────────
    async function handleForgot(e) {
      e.preventDefault();
      if (!requireServer()) return;
      const email = document.getElementById('siEmail').value.trim();
      if (!email) { showMsg('err', '❌ Enter your email above first.'); return; }
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/login.html',
      });
      if (error) showMsg('err', '❌ ' + error.message);
      else showMsg('ok', '📧 Password reset email sent to ' + email);
    }
  </script>
</body>
</html>
